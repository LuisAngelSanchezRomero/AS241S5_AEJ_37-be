name: CodeQL Analysis

# =========================================================
# EVENTOS QUE DISPARAN EL PIPELINE
# =========================================================
on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

# =========================================================
# CONFIGURACIÓN GLOBAL DE ENTORNO (FIJA EL ERROR DE NODE 20)
# =========================================================
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  analyze:
    name: CodeQL Analysis
    runs-on: ubuntu-latest

    # =========================================================
    # PERMISOS NECESARIOS PARA CODEQL
    # =========================================================
    permissions:
      actions: read
      contents: read
      security-events: write

    # =========================================================
    # ESTRATEGIA DE MATRIZ PARA MÚLTIPLES LENGUAJES
    # =========================================================
    strategy:
      fail-fast: false
      matrix:
        language: ['java']

    steps:
      # =========================================================
      # OBTENER EL CÓDIGO DEL REPOSITORIO
      # =========================================================
      - name: Checkout Repository
        uses: actions/checkout@v4

      # =========================================================
      # INICIALIZAR CODEQL (ACTUALIZADO A V4)
      # =========================================================
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}

      # =========================================================
      # AUTOBUILD (ACTUALIZADO A V4)
      # =========================================================
      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      # =========================================================
      # EJECUTAR ANÁLISIS DE CODEQL (ACTUALIZADO A V4)
      # =========================================================
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{matrix.language}}"
