name: SonarQube Cloud

on:
  push:
    branches:
      - develop
      - webflux-sq
  pull_request:
    branches:
      - develop
      - webflux-sq

jobs:
  build:
    name: Build and analyze
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # OBTENER EL CÓDIGO DEL REPOSITORIO
      # =========================================================
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Los clones superficiales deben desactivarse para mayor relevancia del análisis

      # =========================================================
      # CONFIGURAR JDK
      # =========================================================
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'zulu'

      # =========================================================
      # CACHÉ DE PAQUETES SONARQUBE
      # =========================================================
      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      # =========================================================
      # CACHÉ DE PAQUETES MAVEN
      # =========================================================
      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      # =========================================================
      # COMPILAR Y ANALIZAR CON SONARQUBE | Nota del código: A (excelente) → B → C → D → E (pésimo)
      # =========================================================
      - name: Build and analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -DskipTests -Dsonar.projectKey=LuisAngelSanchezRomero_AS241S5_AEJ_37-be

      - name: Pipeline Finished
        run: echo "SonarQube Cloud analysis completed. Check results at https://sonarcloud.io"
