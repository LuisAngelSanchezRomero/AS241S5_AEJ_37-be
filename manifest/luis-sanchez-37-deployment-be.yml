# kubectl apply -f luis-sanchez-37-deployment-be.yml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: luis-sanchez-37-deployment-be
  namespace: luis-sanchez-37-namespace-be
spec:
  replicas: 2
  selector:
    matchLabels:
      app: luis-sanchez-37-deployment-be        # Debe coincidir con las etiquetas del Service
  template:
    metadata:
      labels:
        app: luis-sanchez-37-deployment-be      # Debe coincidir con las etiquetas del Service
    spec:
      containers:
      - name: luis-sanchez-37-container-be
        image: 50luisangelsanchezromero/luis-sanchez-37-be:1.0   # Tu imagen Docker Hub
        imagePullPolicy: Always        # Siempre descargar la última versión
        envFrom:
        - secretRef:
            name: luis-sanchez-37-secret-be  # Esto cargará todos los valores como variables de entorno
