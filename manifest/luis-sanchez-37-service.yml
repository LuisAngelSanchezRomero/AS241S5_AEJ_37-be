# kubectl apply -f luis-sanchez-37-service.yml
apiVersion: v1
kind: Service
metadata:
  name: luis-sanchez-37-service
  namespace: luis-sanchez-37-namespace
spec:
  type: NodePort      #30000-32767  # Cambia a LoadBalancer si estás en un entorno de nube
  ports:
  - port: 30001       # Puerto que el Service expondrá
    targetPort: 8082  # Puerto en el contenedor donde tu aplicación escucha
    nodePort: 30001   # Puerto asignado en el nodo, opcional
  selector:
    app: luis-sanchez-37-deployment  # Debe coincidir con las etiquetas del Deployment